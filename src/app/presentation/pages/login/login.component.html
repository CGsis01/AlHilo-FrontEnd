<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h1 class="logo">AL HILO</h1>
      <p class="subtitle">ajuste y compostura textil</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="email">Usuario</label>
        <input id="email"
          type="email" 
          formControlName="email" 
          placeholder="Escribe tu usuario"
          [class.error]="email?.invalid && email?.touched">
        <span class="error-message" *ngIf="email?.invalid && email?.touched">
          <span *ngIf="email?.errors?.['required']">El usuario es requerido</span>
          <span *ngIf="email?.errors?.['email']">Formato de usuario inválido</span>
        </span>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="password-field">
          <input id="password"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            placeholder="Escribe tu contraseña"
            [class.error]="password?.invalid && password?.touched"
            autocomplete="off">
          <button
            type="button"
            class="toggle-password-btn"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            [attr.title]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'">
            <svg *ngIf="!showPassword()" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M12 5C6.5 5 2 12 2 12s4.5 7 10 7 10-7 10-7-4.5-7-10-7Zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8Zm0-2.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z" />
            </svg>
            <svg *ngIf="showPassword()" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="m3.3 2 18.7 18.7-1.3 1.3-3.2-3.2A10.3 10.3 0 0 1 12 20C6.5 20 2 13 2 13s1.7-2.6 4.5-4.7L2 3.3 3.3 2Zm5.9 8.6 4.2 4.2a3 3 0 0 1-4.2-4.2Zm2.8-6.6c5.5 0 10 7 10 7s-1.6 2.4-4.2 4.5l-1.5-1.5A5 5 0 0 0 10 7.2L8.5 5.7A10.8 10.8 0 0 1 12 4Z" />
            </svg>
          </button>
        </div>
        <span class="error-message" *ngIf="password?.invalid && password?.touched">
          <span *ngIf="password?.errors?.['required']">La contraseña es requerida</span>
          <span *ngIf="password?.errors?.['minlength']">La contraseña debe tener al menos 6 caracteres</span>
        </span>
      </div>

      <div class="error-alert" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <button type="submit" class="login-btn" [disabled]="isLoading() || loginForm.invalid">
        <span *ngIf="!isLoading()">Conectar</span>
        <span *ngIf="isLoading()" class="loading-spinner">Conectando...</span>
      </button>
    </form>
  </div>
</div>
