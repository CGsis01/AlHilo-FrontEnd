<!-- Modal de confirmación para desasignar -->
<div class="modal-overlay" *ngIf="open" (click)="close.emit()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Confirmar desasignación</h2>
      <button class="modal-close" (click)="close.emit()">×</button>
    </div>

    <div class="modal-body">
      <p>¿Seguro que deseas quitar la asignación de esta prenda?</p>
      <p>La prenda volverá al estado <strong>Pendiente</strong>.</p>
    </div>

    <div class="modal-footer">
      <button class="btn-secondary" (click)="close.emit()">Cancelar</button>
      <button class="btn-primary" (click)="confirm.emit()">Sí, desasignar</button>
    </div>
  </div>
</div>
